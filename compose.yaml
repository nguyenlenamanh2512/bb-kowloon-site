services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://www.bb-kowloon.com}
    image: ${IMAGE_NAME:-bb-kowloon-site:local}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    environment:
      SITE_URL: ${SITE_URL:-https://www.bb-kowloon.com}
    security_opt:
      - no-new-privileges:true
