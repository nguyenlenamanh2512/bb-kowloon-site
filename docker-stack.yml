version: "3.8"

services:
  website:
    image: ${IMAGE_NAME:-ghcr.io/nguyenlenamanh2512/bb-kowloon-site:latest}
    environment:
      SITE_URL: ${SITE_URL:-https://www.bbKowloon.com}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-before-production}
      DATA_DIR: /app/storage
      CMS_BOOTSTRAP_USERNAME: ${CMS_BOOTSTRAP_USERNAME:-}
      CMS_BOOTSTRAP_DISPLAY_NAME: ${CMS_BOOTSTRAP_DISPLAY_NAME:-}
      CMS_BOOTSTRAP_PASSWORD: ${CMS_BOOTSTRAP_PASSWORD:-}
    volumes:
      - cms_data:/app/storage
    ports:
      - target: 3000
        published: ${APP_PORT:-3000}
        protocol: tcp
        mode: ingress
    networks:
      - web
    stop_grace_period: 20s
    deploy:
      # The bundled JSON store is single-writer. Keep one replica unless DATA_DIR
      # is replaced with shared storage or the CMS is migrated to an external DB.
      replicas: ${REPLICAS:-1}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

networks:
  web:
    driver: overlay
    attachable: true

volumes:
  cms_data:
