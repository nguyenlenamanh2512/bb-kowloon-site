version: "3.8"

services:
  website:
    image: ${IMAGE_NAME:-ghcr.io/nguyenlemanh2512/bb-kowloon-site:latest}
    environment:
      SITE_URL: ${SITE_URL:-https://www.bb-kowloon.com}
    ports:
      - target: 3000
        published: ${APP_PORT:-3000}
        protocol: tcp
        mode: ingress
    networks:
      - web
    stop_grace_period: 20s
    deploy:
      replicas: ${REPLICAS:-2}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

networks:
  web:
    driver: overlay
    attachable: true
